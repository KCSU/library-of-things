[project]
name = "library-of-things"
version = "0.1.0"
description = "KCSU Library of Things"
requires-python = ">=3.10"
dependencies = [
    "authlib==1.3.2",
    "cachetools==5.3.3",
    "flask-talisman==1.1.0",
    "Flask==3.0.3",
    "gunicorn==22.0.0",
    "python-dotenv==1.0.1",
    "PyMySQL==1.1.1",
    "SQLAlchemy==2.0.44",
    "requests==2.32.4",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-flask==1.3.0",
]

[tool.uv]
package = false
