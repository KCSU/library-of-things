[project]
name = "library-of-things"
version = "0.1.0"
description = "KCSU Library of Things"
requires-python = ">=3.14"
dependencies = [
    "authlib==1.9.1",
    "cachetools==5.3.3",
    "flask-talisman==1.1.0",
    "Flask==3.0.3",
    "gunicorn==22.0.0",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.44",
    "requests==2.32.4",
    "pillow>=12.3.0",
    "protobuf==7.36.2",
    "google-auth==2.61.0",
    "pydantic==2.12.5",
    "psycopg[binary]==3.3.6",
    "sqlalchemy-cockroachdb==2.0.3",
    "certifi==2026.10.18",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pre-commit>=4.6.2",
    "pytest==8.2.0",
    "pytest-flask==1.3.0",
    "ruff>=0.16.8",
    "ty>=0.0.1a14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
# Generated by scripts/gen_proto.sh
extend-exclude = ["app/proto"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "Q"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"tools/**" = ["ANN"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.src]
include = ["app", "tools"]
exclude = ["app/proto"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
